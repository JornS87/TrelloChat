<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Badfellas Chat</title>

<style>
:root {
  --bg: #020b13;
  --panel: #04131f;
  --cyan: #16d5ff;
  --cyan-dark: #087da5;
  --text: #f2f8fc;
  --muted: #7095ae;
  --green: #22df65;
  --danger: #ff6475;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
}

.chat-app {
  width: 100%;
  height: 100vh;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(13, 112, 151, .18),
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #03111c,
      #020b13
    );
}


/* =========================
   HEADER
========================= */

.header {
  min-height: 82px;

  padding: 14px 16px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  border-bottom: 1px solid #075e7e;

  background:
    linear-gradient(
      135deg,
      #061b2b,
      #03101a
    );
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;

  min-width: 0;
}

.brand-icon {
  width: 46px;
  height: 46px;

  min-width: 46px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  border: 1px solid #0c759b;

  background:
    linear-gradient(
      145deg,
      #0b2940,
      #04131f
    );

  font-size: 22px;
}

.brand-name {
  color: #9bdcff;

  font-size: 19px;
  font-weight: 800;

  letter-spacing: 1.4px;
}

.brand-subtitle {
  margin-top: 4px;

  color: #5c91b4;

  font-size: 7px;

  letter-spacing: 1.5px;

  white-space: nowrap;
}


/* =========================
   HEADER RECHTS
========================= */

.header-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;

  gap: 8px;
}

.online {
  display: flex;
  align-items: center;

  gap: 6px;

  color: #76a6c3;

  font-size: 10px;
}

.online-dot {
  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: var(--green);

  box-shadow:
    0 0 8px
    rgba(34, 223, 101, .65);
}


/* =========================
   DELETE ALL
========================= */

.delete-all {
  padding: 6px 10px;

  border: 1px solid
    rgba(255, 100, 117, .55);

  border-radius: 8px;

  cursor: pointer;

  color: #ff9aa6;

  background:
    rgba(255, 100, 117, .08);

  font-size: 10px;
  font-weight: 700;
}

.delete-all:hover {
  color: white;

  border-color: var(--danger);

  background:
    rgba(255, 100, 117, .22);
}


/* =========================
   CHAT TITEL
========================= */

.chat-heading {
  padding: 12px 16px;

  border-bottom:
    1px solid
    rgba(7, 94, 126, .40);
}

.chat-heading strong {
  font-size: 14px;
}

.chat-heading span {
  margin-left: 6px;

  color: var(--muted);

  font-size: 10px;
}


/* =========================
   BERICHTEN
========================= */

#chat {
  flex: 1;

  min-height: 0;

  overflow-y: auto;

  padding: 18px 14px 25px;

  scroll-behavior: smooth;
}

#chat::-webkit-scrollbar {
  width: 6px;
}

#chat::-webkit-scrollbar-thumb {
  background: #0b506b;

  border-radius: 10px;
}


/* =========================
   BERICHTREGEL
========================= */

.message-row {
  width: 100%;

  display: flex;
  align-items: flex-end;

  gap: 9px;

  margin-bottom: 17px;
}

.message-row.own {
  flex-direction: row-reverse;
}


/* =========================
   AVATAR
========================= */

.avatar {
  width: 38px;
  height: 38px;

  min-width: 38px;

  overflow: hidden;

  display: grid;
  place-items: center;

  border-radius: 50%;

  border: 1px solid #15516c;

  background:
    linear-gradient(
      145deg,
      #12334b,
      #071724
    );

  color: #c3ebff;

  font-size: 11px;
  font-weight: 800;
}

.message-row.own .avatar {
  border-color: #11b8e4;

  box-shadow:
    0 0 10px
    rgba(22, 213, 255, .12);
}

.avatar img {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;
}


/* =========================
   MESSAGE CONTENT
========================= */

.message-content {
  max-width: 78%;
}

.message-row.own .message-content {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}


/* =========================
   NAAM / TIJD
========================= */

.meta {
  min-height: 20px;

  margin: 0 6px 4px;

  display: flex;
  align-items: center;

  gap: 6px;
}

.message-row.own .meta {
  flex-direction: row-reverse;
}

.name {
  color: #edf8ff;

  font-size: 12px;
  font-weight: 700;
}

.time {
  color: #668da7;

  font-size: 9px;
}


/* =========================
   DELETE PER BERICHT
========================= */

.delete-message {
  width: 22px;
  height: 22px;

  padding: 0;

  display: grid;
  place-items: center;

  border: 0;
  border-radius: 6px;

  cursor: pointer;

  color: #688ba3;

  background: transparent;

  font-size: 11px;

  opacity: .6;
}

.delete-message:hover {
  opacity: 1;

  color: var(--danger);

  background:
    rgba(255, 100, 117, .12);
}


/* =========================
   BERICHTBALLON
========================= */

.message-bubble {
  min-width: 85px;

  padding: 11px 13px;

  border: 1px solid #075b79;

  border-radius:
    7px 16px 16px 16px;

  background:
    linear-gradient(
      145deg,
      #071d2c,
      #04131e
    );

  box-shadow:
    0 5px 14px
    rgba(0, 0, 0, .15);
}

.message-row.own .message-bubble {
  border-color: #0c99c3;

  border-radius:
    16px 7px 16px 16px;

  background:
    linear-gradient(
      145deg,
      #07506a,
      #063248
    );
}

.message-text {
  font-size: 13px;

  line-height: 1.45;

  white-space: pre-wrap;

  word-break: break-word;
}


/* =========================
   GEEN BERICHTEN
========================= */

.empty {
  padding: 80px 20px;

  text-align: center;

  color: #557c97;

  font-size: 13px;

  line-height: 1.5;
}


/* =========================
   INVOERVELD
========================= */

.composer {
  padding: 12px;

  border-top:
    1px solid
    rgba(8, 125, 165, .45);

  background:
    rgba(2, 11, 19, .98);
}

.input-box {
  min-height: 54px;

  display: flex;
  align-items: stretch;

  overflow: hidden;

  border: 1px solid #087da5;

  border-radius: 13px;

  background: #020e17;
}

.input-icon {
  width: 44px;

  min-width: 44px;

  display: grid;
  place-items: center;

  border-right:
    1px solid #075876;

  color: #6fb5d4;

  font-size: 18px;
}

#messageInput {
  flex: 1;

  min-width: 0;

  padding: 0 12px;

  border: 0;
  outline: 0;

  color: white;

  background: transparent;

  font-size: 13px;
}

#messageInput::placeholder {
  color: #55768e;
}

#sendButton {
  min-width: 92px;

  padding: 0 13px;

  border: 0;

  border-left:
    1px solid #18cef6;

  cursor: pointer;

  color: white;

  background:
    linear-gradient(
      135deg,
      #087da5,
      #12bce6
    );

  font-size: 11px;
  font-weight: 700;
}

#sendButton:hover {
  filter: brightness(1.12);
}

#sendButton:disabled {
  opacity: .5;

  cursor: default;
}


/* =========================
   FOOTER
========================= */

.footer {
  padding: 7px 3px 0;

  display: flex;
  justify-content: space-between;

  gap: 10px;

  color: #547c97;

  font-size: 8px;
}

.footer strong {
  color: #6e9ebc;

  letter-spacing: 1px;
}

</style>
</head>


<body>

<div class="chat-app">


  <header class="header">

    <div class="brand">

      <div class="brand-icon">
        🎩
      </div>

      <div>

        <div class="brand-name">
          BADFELLAS
        </div>

        <div class="brand-subtitle">
          GOOD PEOPLE · GREAT PROJECTS
        </div>

      </div>

    </div>


    <div class="header-actions">

      <div class="online">
        <span class="online-dot"></span>
        <span>Online</span>
      </div>

      <button
        id="deleteAllButton"
        class="delete-all"
        type="button"
      >
        🗑 Delete all
      </button>

    </div>

  </header>


  <div class="chat-heading">

    <strong>
      💬 Team Chat
    </strong>

    <span>
      Samen sterker
    </span>

  </div>


  <main id="chat">

    <div class="empty">
      Berichten laden...
    </div>

  </main>


  <div class="composer">

    <div class="input-box">

      <div class="input-icon">
        ✎
      </div>

      <input
        id="messageInput"
        type="text"
        maxlength="1000"
        autocomplete="off"
        placeholder="Typ je bericht..."
      >

      <button
        id="sendButton"
        type="button"
      >
        ➤ Verstuur
      </button>

    </div>


    <div class="footer">

      <span>
        Automatisch opgeslagen
      </span>

      <strong>
        BADFELLAS.NL
      </strong>

    </div>

  </div>

</div>


<script src="https://p.trellocdn.com/power-up.min.js"></script>

<script>

const t =
  window.TrelloPowerUp.iframe();


let currentMember = {

  id: null,

  name: 'Teamlid',

  username: '',

  initials: '??',

  avatar: null

};


/* =========================
   TRELLO GEBRUIKER
========================= */

async function loadCurrentMember() {

  try {

    const context =
      t.getContext();


    if (
      context &&
      context.member &&
      context.member !== 'notLoggedIn'
    ) {

      currentMember.id =
        String(context.member);

    }


    const member =
      await t.member(
        'id',
        'fullName',
        'username',
        'initials',
        'avatar'
      );


    if (member) {

      if (member.id) {

        currentMember.id =
          String(member.id);

      }


      currentMember.name =
        member.fullName ||
        member.username ||
        'Teamlid';


      currentMember.username =
        member.username || '';


      currentMember.initials =
        member.initials ||
        makeInitials(
          currentMember.name
        );


      currentMember.avatar =
        member.avatar || null;

    }


  } catch(error) {

    console.error(
      'Gebruiker laden mislukt:',
      error
    );

  }

}


/* =========================
   INITIALEN
========================= */

function makeInitials(name) {

  if (!name) {
    return '??';
  }


  const parts =
    String(name)
      .trim()
      .split(/\s+/)
      .filter(Boolean);


  if (!parts.length) {
    return '??';
  }


  if (parts.length === 1) {

    return parts[0]
      .substring(0, 2)
      .toUpperCase();

  }


  return (
    parts[0][0] +
    parts[parts.length - 1][0]
  ).toUpperCase();

}


/* =========================
   BERICHT ID
========================= */

function createMessageId() {

  if (
    window.crypto &&
    typeof window.crypto.randomUUID ===
    'function'
  ) {

    return window.crypto.randomUUID();

  }


  return (
    Date.now().toString(36) +
    '-' +
    Math.random()
      .toString(36)
      .substring(2, 10)
  );

}


/* =========================
   AVATAR
========================= */

function createAvatar(message) {

  const avatar =
    document.createElement('div');


  avatar.className =
    'avatar';


  if (message.avatar) {

    const image =
      document.createElement('img');


    image.src =
      message.avatar;


    image.alt =
      message.name ||
      'Trello gebruiker';


    image.onerror =
      function() {

        avatar.innerHTML = '';

        avatar.textContent =
          message.initials ||
          makeInitials(
            message.name
          );

      };


    avatar.appendChild(
      image
    );

  } else {

    avatar.textContent =
      message.initials ||
      makeInitials(
        message.name
      );

  }


  return avatar;

}


/* =========================
   TIJD
========================= */

function formatTime(value) {

  if (!value) {
    return '';
  }


  const date =
    new Date(value);


  if (isNaN(date.getTime())) {
    return '';
  }


  return date.toLocaleString(
    'nl-NL',
    {
      day: '2-digit',
      month: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    }
  );

}


/* =========================
   BERICHTEN LADEN
========================= */

async function loadMessages(
  forceBottom = false
) {

  try {

    const chat =
      document.getElementById(
        'chat'
      );


    const nearBottom =
      chat.scrollHeight -
      chat.scrollTop -
      chat.clientHeight <
      100;


    let messages =
      await t.get(
        'board',
        'shared',
        'messages',
        []
      );


    if (!Array.isArray(messages)) {

      messages = [];

    }


    chat.innerHTML = '';


    if (!messages.length) {

      chat.innerHTML =
        '<div class="empty">' +
        '💬<br><br>' +
        'Nog geen berichten.<br>' +
        'Start het gesprek!' +
        '</div>';

      return;

    }


    messages.forEach(
      function(message, index) {


        const isOwn =
          !!currentMember.id &&
          !!message.memberId &&
          String(message.memberId) ===
          String(currentMember.id);


        const row =
          document.createElement('div');


        row.className =
          'message-row' +
          (isOwn ? ' own' : '');


        const avatar =
          createAvatar(message);


        const content =
          document.createElement('div');


        content.className =
          'message-content';


        const meta =
          document.createElement('div');


        meta.className =
          'meta';


        const name =
          document.createElement('span');


        name.className =
          'name';


        name.textContent =
          message.name ||
          'Teamlid';


        const time =
          document.createElement('span');


        time.className =
          'time';


        time.textContent =
          formatTime(
            message.time
          );


        meta.appendChild(
          name
        );


        meta.appendChild(
          time
        );


        /*
          Alleen bij je eigen bericht
          verschijnt de prullenbak.
        */

        if (isOwn) {

          const deleteButton =
            document.createElement(
              'button'
            );


          deleteButton.type =
            'button';


          deleteButton.className =
            'delete-message';


          deleteButton.title =
            'Bericht verwijderen';


          deleteButton.textContent =
            '🗑';


          deleteButton.addEventListener(
            'click',
            function() {

              deleteMessage(
                message.id,
                index
              );

            }
          );


          meta.appendChild(
            deleteButton
          );

        }


        const bubble =
          document.createElement('div');


        bubble.className =
          'message-bubble';


        const messageText =
          document.createElement('div');


        messageText.className =
          'message-text';


        messageText.textContent =
          message.text || '';


        bubble.appendChild(
          messageText
        );


        content.appendChild(
          meta
        );


        content.appendChild(
          bubble
        );


        row.appendChild(
          avatar
        );


        row.appendChild(
          content
        );


        chat.appendChild(
          row
        );

      }
    );


    if (
      forceBottom ||
      nearBottom
    ) {

      chat.scrollTop =
        chat.scrollHeight;

    }


  } catch(error) {

    console.error(
      'Berichten laden mislukt:',
      error
    );

  }

}


/* =========================
   VERSTUREN
========================= */

async function sendMessage() {

  const input =
    document.getElementById(
      'messageInput'
    );


  const button =
    document.getElementById(
      'sendButton'
    );


  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  try {

    button.disabled = true;


    await loadCurrentMember();


    if (!currentMember.id) {

      alert(
        'Je Trello-gebruiker kon niet worden gevonden.'
      );

      return;

    }


    let messages =
      await t.get(
        'board',
        'shared',
        'messages',
        []
      );


    if (!Array.isArray(messages)) {

      messages = [];

    }


    const newMessage = {

      id:
        createMessageId(),

      memberId:
        currentMember.id,

      name:
        currentMember.name,

      username:
        currentMember.username,

      initials:
        currentMember.initials,

      avatar:
        currentMember.avatar,

      text:
        text,

      time:
        new Date()
          .toISOString()

    };


    messages.push(
      newMessage
    );


    await t.set(
      'board',
      'shared',
      'messages',
      messages
    );


    input.value = '';


    await loadMessages(
      true
    );


    input.focus();


  } catch(error) {

    console.error(
      'Versturen mislukt:',
      error
    );


    alert(
      'Het bericht kon niet worden verstuurd.'
    );


  } finally {

    button.disabled = false;

  }

}


/* =========================
   ÉÉN BERICHT VERWIJDEREN
========================= */

async function deleteMessage(
  messageId,
  fallbackIndex
) {

  const confirmed =
    window.confirm(
      'Bericht verwijderen?\n\n' +
      'Weet je zeker dat je dit bericht wilt verwijderen?'
    );


  if (!confirmed) {
    return;
  }


  try {

    await loadCurrentMember();


    let messages =
      await t.get(
        'board',
        'shared',
        'messages',
        []
      );


    if (!Array.isArray(messages)) {
      return;
    }


    let targetIndex = -1;


    if (messageId) {

      targetIndex =
        messages.findIndex(
          function(message) {

            return (
              message.id ===
              messageId
            );

          }
        );

    } else {

      targetIndex =
        fallbackIndex;

    }


    if (
      targetIndex < 0 ||
      !messages[targetIndex]
    ) {

      alert(
        'Dit bericht bestaat niet meer.'
      );

      await loadMessages();

      return;

    }


    const target =
      messages[targetIndex];


    if (
      !target.memberId ||
      String(target.memberId) !==
      String(currentMember.id)
    ) {

      alert(
        'Je kunt alleen je eigen berichten verwijderen.'
      );

      await loadMessages();

      return;

    }


    messages.splice(
      targetIndex,
      1
    );


    await t.set(
      'board',
      'shared',
      'messages',
      messages
    );


    await loadMessages();


  } catch(error) {

    console.error(
      'Verwijderen mislukt:',
      error
    );


    alert(
      'Het bericht kon niet worden verwijderd.'
    );

  }

}


/* =========================
   DELETE ALL
========================= */

async function deleteAllMessages() {

  const confirmed =
    window.confirm(
      'ALLE BERICHTEN VERWIJDEREN?\n\n' +
      'Weet je zeker dat je ALLE chatberichten wilt verwijderen?\n\n' +
      'Dit kan niet ongedaan worden gemaakt.'
    );


  if (!confirmed) {
    return;
  }


  const button =
    document.getElementById(
      'deleteAllButton'
    );


  try {

    button.disabled = true;


    await t.set(
      'board',
      'shared',
      'messages',
      []
    );


    await loadMessages(
      true
    );


  } catch(error) {

    console.error(
      'Delete all mislukt:',
      error
    );


    alert(
      'De berichten konden niet worden verwijderd.'
    );


  } finally {

    button.disabled = false;

  }

}


/* =========================
   EVENTS
========================= */

document
  .getElementById(
    'sendButton'
  )
  .addEventListener(
    'click',
    sendMessage
  );


document
  .getElementById(
    'deleteAllButton'
  )
  .addEventListener(
    'click',
    deleteAllMessages
  );


document
  .getElementById(
    'messageInput'
  )
  .addEventListener(
    'keydown',
    function(event) {

      if (event.key === 'Enter') {

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================
   START
========================= */

async function startChat() {

  await loadCurrentMember();

  await loadMessages(
    true
  );


  /*
    Nieuwe berichten iedere
    5 seconden ophalen.
  */

  setInterval(
    function() {

      loadMessages(
        false
      );

    },
    5000
  );

}


startChat();

</script>

</body>
</html>
