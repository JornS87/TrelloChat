<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Badfellas Chat</title>

<style>
:root {
  --bg: #020b13;
  --panel: #04131f;
  --panel2: #061a29;
  --cyan: #16d5ff;
  --cyan-dark: #087da5;
  --text: #f2f8fc;
  --muted: #7095ae;
  --green: #22df65;
  --danger: #ff6475;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(13, 112, 151, .16),
      transparent 35%
    ),
    #020b13;

  overflow: hidden;
}


/* =========================
   BUITENKANT
========================= */

.page {
  width: 100%;
  height: 100vh;

  display: flex;
  justify-content: center;

  padding: 10px;
}


/*
  Dit maakt de chat bewust smaller.
  Op een breed Trello-scherm blijft
  hij dus als echte chatkolom staan.
*/

.chat-app {
  width: 100%;
  max-width: 520px;
  height: 100%;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  border: 1px solid #075e7e;
  border-radius: 18px;

  background:
    linear-gradient(
      180deg,
      #03111c,
      #020b13
    );

  box-shadow:
    0 20px 50px
    rgba(0, 0, 0, .28);
}


/* =========================
   HEADER
========================= */

.header {
  min-height: 82px;

  padding: 13px 16px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  border-bottom:
    1px solid #075e7e;

  background:
    linear-gradient(
      135deg,
      #061b2b,
      #03101a
    );
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;

  min-width: 0;
}

.brand-icon {
  width: 45px;
  height: 45px;

  min-width: 45px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  border:
    1px solid #0c759b;

  background:
    linear-gradient(
      145deg,
      #0b2940,
      #04131f
    );

  font-size: 23px;
}

.brand-name {
  font-size: 19px;
  font-weight: 800;

  letter-spacing: 1.5px;

  color: #9bdcff;
}

.brand-subtitle {
  margin-top: 4px;

  font-size: 7px;

  letter-spacing: 2px;

  color: #5c91b4;

  white-space: nowrap;
}

.header-status {
  text-align: right;

  font-size: 10px;

  color: #73a2bf;

  white-space: nowrap;
}

.status-line {
  margin-top: 5px;

  display: flex;
  justify-content: flex-end;
  align-items: center;

  gap: 6px;
}

.online-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: var(--green);

  box-shadow:
    0 0 8px
    rgba(34, 223, 101, .65);
}


/* =========================
   TITEL
========================= */

.chat-heading {
  padding: 13px 17px 10px;

  border-bottom:
    1px solid
    rgba(7, 94, 126, .35);
}

.chat-heading h1 {
  margin: 0;

  font-size: 15px;

  letter-spacing: .3px;
}

.chat-heading p {
  margin: 4px 0 0;

  font-size: 10px;

  color: var(--muted);
}


/* =========================
   BERICHTEN
========================= */

#chat {
  flex: 1;
  min-height: 0;

  overflow-y: auto;

  padding: 16px 13px 24px;

  scroll-behavior: smooth;
}

#chat::-webkit-scrollbar {
  width: 6px;
}

#chat::-webkit-scrollbar-thumb {
  background: #0b506b;
  border-radius: 10px;
}


/* =========================
   BERICHTREGEL
========================= */

.message-row {
  width: 100%;

  display: flex;
  align-items: flex-end;

  gap: 8px;

  margin-bottom: 14px;
}


/*
  Eigen berichten naar rechts.
*/

.message-row.own {
  flex-direction: row-reverse;
}


/* =========================
   AVATAR
========================= */

.avatar {
  width: 34px;
  height: 34px;

  min-width: 34px;

  overflow: hidden;

  display: grid;
  place-items: center;

  border-radius: 50%;

  border:
    1px solid #15516c;

  background:
    linear-gradient(
      145deg,
      #12334b,
      #071724
    );

  color: #c3ebff;

  font-size: 10px;
  font-weight: 800;
}

.message-row.own .avatar {
  border-color: #11b8e4;
}

.avatar img {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;
}


/* =========================
   CONTENT
========================= */

.message-content {
  max-width: 76%;
}

.message-row.own .message-content {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}


/* =========================
   NAAM + TIJD
========================= */

.meta {
  margin:
    0 6px 4px;

  display: flex;
  align-items: center;

  gap: 6px;

  min-height: 18px;
}

.message-row.own .meta {
  flex-direction: row-reverse;
}

.name {
  font-size: 11px;
  font-weight: 700;

  color: #edf8ff;
}

.time {
  font-size: 8px;

  color: #668da7;
}


/* =========================
   DELETE
========================= */

.delete-button {
  width: 21px;
  height: 21px;

  padding: 0;

  display: grid;
  place-items: center;

  border: 0;
  border-radius: 6px;

  background: transparent;

  color: #688ba3;

  cursor: pointer;

  font-size: 11px;

  opacity: .6;
}

.delete-button:hover {
  opacity: 1;

  color: var(--danger);

  background:
    rgba(255, 100, 117, .10);
}


/* =========================
   BUBBLE
========================= */

.message {
  min-width: 80px;

  padding: 9px 12px;

  border:
    1px solid #075b79;

  border-radius:
    6px 15px 15px 15px;

  background:
    linear-gradient(
      145deg,
      #071d2c,
      #04131e
    );

  box-shadow:
    0 5px 15px
    rgba(0, 0, 0, .13);
}

.message-row.own .message {
  border-color: #0c99c3;

  border-radius:
    15px 6px 15px 15px;

  background:
    linear-gradient(
      145deg,
      #07506a,
      #063248
    );
}

.message-text {
  font-size: 12px;

  line-height: 1.45;

  white-space: pre-wrap;

  word-break: break-word;
}


/* =========================
   LEGE CHAT
========================= */

.empty {
  padding: 70px 20px;

  text-align: center;

  color: #557c97;

  font-size: 12px;
}


/* =========================
   TYPEVAK
========================= */

.composer {
  padding: 10px;

  border-top:
    1px solid
    rgba(8, 125, 165, .4);

  background:
    rgba(2, 11, 19, .98);
}

.input-box {
  min-height: 48px;

  display: flex;
  align-items: stretch;

  overflow: hidden;

  border:
    1px solid #087da5;

  border-radius: 13px;

  background: #020e17;
}

.input-icon {
  width: 40px;

  min-width: 40px;

  display: grid;
  place-items: center;

  border-right:
    1px solid #075876;

  color: #6fb5d4;

  font-size: 17px;
}

#messageInput {
  flex: 1;

  min-width: 0;

  padding: 0 11px;

  border: 0;
  outline: 0;

  background: transparent;

  color: white;

  font-size: 12px;
}

#messageInput::placeholder {
  color: #55768e;
}

#sendButton {
  min-width: 88px;

  padding: 0 12px;

  border: 0;

  border-left:
    1px solid #18cef6;

  cursor: pointer;

  color: white;

  font-size: 11px;
  font-weight: 700;

  background:
    linear-gradient(
      135deg,
      #087da5,
      #12bce6
    );
}

#sendButton:hover {
  filter: brightness(1.1);
}

#sendButton:disabled {
  opacity: .5;

  cursor: default;
}


/* =========================
   FOOTER
========================= */

.footer {
  padding: 7px 3px 0;

  display: flex;
  justify-content: space-between;

  gap: 10px;

  color: #547c97;

  font-size: 8px;
}

.footer strong {
  color: #6e9ebc;

  letter-spacing: 1px;
}


/* =========================
   SMALLER SCREENS
========================= */

@media (max-width: 560px) {

  .page {
    padding: 0;
  }

  .chat-app {
    max-width: none;

    border-left: 0;
    border-right: 0;
    border-radius: 0;
  }

  .header {
    min-height: 72px;
  }

  .brand-icon {
    width: 39px;
    height: 39px;

    min-width: 39px;

    font-size: 20px;
  }

  .brand-name {
    font-size: 17px;
  }

  .brand-subtitle {
    letter-spacing: 1px;
  }

  .footer strong {
    display: none;
  }

}

</style>
</head>

<body>

<div class="page">

  <div class="chat-app">


    <!-- HEADER -->

    <header class="header">

      <div class="brand">

        <div class="brand-icon">
          🎩
        </div>

        <div>

          <div class="brand-name">
            BADFELLAS
          </div>

          <div class="brand-subtitle">
            GOOD PEOPLE · GREAT PROJECTS
          </div>

        </div>

      </div>


      <div class="header-status">

        Trello Chat

        <div class="status-line">

          <span class="online-dot"></span>

          <span>Online</span>

        </div>

      </div>

    </header>


    <!-- CHAT TITEL -->

    <div class="chat-heading">

      <h1>
        Team Chat
      </h1>

      <p>
        Stel een vraag of stuur je team een bericht.
      </p>

    </div>


    <!-- BERICHTEN -->

    <main id="chat">

      <div class="empty">
        Berichten laden...
      </div>

    </main>


    <!-- INVOER -->

    <div class="composer">

      <div class="input-box">

        <div class="input-icon">
          ✎
        </div>

        <input
          id="messageInput"
          type="text"
          maxlength="1000"
          autocomplete="off"
          placeholder="Typ je bericht..."
        >

        <button
          id="sendButton"
          type="button"
        >
          ➤ Verstuur
        </button>

      </div>


      <div class="footer">

        <span>
          Berichten worden automatisch opgeslagen
        </span>

        <strong>
          BADFELLAS.NL
        </strong>

      </div>

    </div>


  </div>

</div>


<script src="https://p.trellocdn.com/power-up.min.js"></script>

<script>

/* =========================
   TRELLO STARTEN
========================= */

const t =
  window.TrelloPowerUp.iframe();


let currentMember = {

  id: null,

  name: 'Teamlid',

  username: '',

  initials: '??',

  avatar: null

};


/* =========================
   HUIDIGE GEBRUIKER
========================= */

async function loadCurrentMember() {

  try {

    const context =
      t.getContext();


    /*
      Uit onze Trello-test weten we
      dat context.member rechtstreeks
      de member-ID bevat.
    */

    if (
      context &&
      context.member &&
      context.member !== 'notLoggedIn'
    ) {

      currentMember.id =
        String(context.member);

    }


    /*
      Trello-profiel ophalen.
    */

    const member =
      await t.member(
        'id',
        'fullName',
        'username',
        'initials',
        'avatar'
      );


    if (member) {

      if (member.id) {

        currentMember.id =
          String(member.id);

      }


      currentMember.name =
        member.fullName ||
        member.username ||
        'Teamlid';


      currentMember.username =
        member.username || '';


      currentMember.initials =
        member.initials ||
        makeInitials(
          currentMember.name
        );


      currentMember.avatar =
        member.avatar || null;

    }


    console.log(
      'Ingelogde Trello gebruiker:',
      currentMember
    );


  } catch(error) {

    console.error(
      'Trello gebruiker laden mislukt:',
      error
    );

  }

}


/* =========================
   INITIALEN MAKEN
========================= */

function makeInitials(name) {

  if (!name) {
    return '??';
  }


  const parts =
    String(name)
      .trim()
      .split(/\s+/)
      .filter(Boolean);


  if (!parts.length) {
    return '??';
  }


  if (parts.length === 1) {

    return parts[0]
      .substring(0, 2)
      .toUpperCase();

  }


  return (
    parts[0][0] +
    parts[parts.length - 1][0]
  ).toUpperCase();

}


/* =========================
   UNIEK ID
========================= */

function createMessageId() {

  if (
    window.crypto &&
    typeof window.crypto.randomUUID ===
    'function'
  ) {

    return window.crypto.randomUUID();

  }


  return (
    Date.now().toString(36) +
    '-' +
    Math.random()
      .toString(36)
      .substring(2, 10)
  );

}


/* =========================
   AVATAR
========================= */

function createAvatar(message) {

  const avatar =
    document.createElement('div');


  avatar.className =
    'avatar';


  if (message.avatar) {

    const image =
      document.createElement('img');


    image.src =
      message.avatar;


    image.alt =
      message.name ||
      'Trello gebruiker';


    image.onerror =
      function() {

        avatar.innerHTML = '';

        avatar.textContent =
          message.initials ||
          makeInitials(
            message.name
          );

      };


    avatar.appendChild(image);

  } else {

    avatar.textContent =
      message.initials ||
      makeInitials(
        message.name
      );

  }


  return avatar;

}


/* =========================
   TIJD WEERGEVEN
========================= */

function formatTime(value) {

  if (!value) {
    return '';
  }


  const date =
    new Date(value);


  if (
    isNaN(date.getTime())
  ) {

    return '';

  }


  return date.toLocaleString(
    'nl-NL',
    {
      day: '2-digit',
      month: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    }
  );

}


/* =========================
   BERICHTEN LADEN
========================= */

async function loadMessages(
  forceBottom = false
) {

  try {

    const chat =
      document.getElementById(
        'chat'
      );


    const nearBottom =
      chat.scrollHeight -
      chat.scrollTop -
      chat.clientHeight <
      100;


    const messages =
      await t.get(
        'board',
        'shared',
        'messages',
        []
      );


    chat.innerHTML = '';


    if (
      !Array.isArray(messages) ||
      messages.length === 0
    ) {

      chat.innerHTML =
        '<div class="empty">' +
        'Nog geen berichten.<br><br>' +
        'Start het gesprek!' +
        '</div>';

      return;

    }


    messages.forEach(
      function(message, index) {


        /*
          Is dit mijn eigen bericht?
        */

        const isOwn =
          !!currentMember.id &&
          !!message.memberId &&
          String(message.memberId) ===
          String(currentMember.id);


        /*
          Hele regel
        */

        const row =
          document.createElement(
            'div'
          );


        row.className =
          'message-row' +
          (isOwn ? ' own' : '');


        /*
          Avatar
        */

        const avatar =
          createAvatar(message);


        /*
          Bericht content
        */

        const content =
          document.createElement(
            'div'
          );


        content.className =
          'message-content';


        /*
          Meta informatie
        */

        const meta =
          document.createElement(
            'div'
          );


        meta.className =
          'meta';


        /*
          Naam
        */

        const name =
          document.createElement(
            'span'
          );


        name.className =
          'name';


        name.textContent =
          message.name ||
          'Teamlid';


        /*
          Tijd
        */

        const time =
          document.createElement(
            'span'
          );


        time.className =
          'time';


        time.textContent =
          formatTime(
            message.time
          );


        meta.appendChild(name);

        meta.appendChild(time);


        /*
          Prullenbak alleen
          bij eigen berichten.
        */

        if (isOwn) {

          const deleteButton =
            document.createElement(
              'button'
            );


          deleteButton.type =
            'button';


          deleteButton.className =
            'delete-button';


          deleteButton.title =
            'Bericht verwijderen';


          deleteButton.textContent =
            '🗑';


          deleteButton.addEventListener(
            'click',
            function() {

              deleteMessage(
                message.id,
                index
              );

            }
          );


          meta.appendChild(
            deleteButton
          );

        }


        /*
          Bubble
        */

        const bubble =
          document.createElement(
            'div'
          );


        bubble.className =
          'message';


        const messageText =
          document.createElement(
            'div'
          );


        messageText.className =
          'message-text';


        messageText.textContent =
          message.text || '';


        bubble.appendChild(
          messageText
        );


        /*
          Samenstellen
        */

        content.appendChild(
          meta
        );


        content.appendChild(
          bubble
        );


        row.appendChild(
          avatar
        );


        row.appendChild(
          content
        );


        chat.appendChild(
          row
        );

      }
    );


    if (
      forceBottom ||
      nearBottom
    ) {

      chat.scrollTop =
        chat.scrollHeight;

    }


  } catch(error) {

    console.error(
      'Berichten laden mislukt:',
      error
    );

  }

}


/* =========================
   BERICHT VERSTUREN
========================= */

async function sendMessage() {

  const input =
    document.getElementById(
      'messageInput'
    );


  const button =
    document.getElementById(
      'sendButton'
    );


  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  try {

    button.disabled = true;


    /*
      Voor verzenden controleren we
      opnieuw wie is ingelogd.
    */

    await loadCurrentMember();


    if (!currentMember.id) {

      alert(
        'Je Trello-gebruiker kon niet worden gevonden.'
      );

      return;

    }


    let messages =
      await t.get(
        'board',
        'shared',
        'messages',
        []
      );


    if (!Array.isArray(messages)) {

      messages = [];

    }


    const newMessage = {

      id:
        createMessageId(),

      memberId:
        currentMember.id,

      name:
        currentMember.name,

      username:
        currentMember.username,

      initials:
        currentMember.initials,

      avatar:
        currentMember.avatar,

      text:
        text,

      time:
        new Date()
          .toISOString()

    };


    messages.push(
      newMessage
    );


    await t.set(
      'board',
      'shared',
      'messages',
      messages
    );


    input.value = '';


    await loadMessages(true);


    input.focus();


  } catch(error) {

    console.error(
      'Versturen mislukt:',
      error
    );


    alert(
      'Het bericht kon niet worden verstuurd.'
    );


  } finally {

    button.disabled = false;

  }

}


/* =========================
   BERICHT VERWIJDEREN
========================= */

async function deleteMessage(
  messageId,
  fallbackIndex
) {

  const confirmed =
    window.confirm(
      'Bericht verwijderen?\n\n' +
      'Weet je zeker dat je dit bericht wilt verwijderen?'
    );


  if (!confirmed) {
    return;
  }


  try {

    /*
      Eerst opnieuw bepalen
      wie de huidige gebruiker is.
    */

    await loadCurrentMember();


    let messages =
      await t.get(
        'board',
        'shared',
        'messages',
        []
      );


    if (!Array.isArray(messages)) {
      return;
    }


    /*
      Bericht opnieuw zoeken in
      de nieuwste versie van de chat.
    */

    let targetIndex = -1;


    if (messageId) {

      targetIndex =
        messages.findIndex(
          function(message) {

            return (
              message.id ===
              messageId
            );

          }
        );

    } else {

      targetIndex =
        fallbackIndex;

    }


    if (
      targetIndex < 0 ||
      !messages[targetIndex]
    ) {

      alert(
        'Dit bericht bestaat niet meer.'
      );

      await loadMessages();

      return;

    }


    const target =
      messages[targetIndex];


    /*
      Extra controle:
      alleen de auteur mag verwijderen.
    */

    if (
      !target.memberId ||
      String(target.memberId) !==
      String(currentMember.id)
    ) {

      alert(
        'Je kunt alleen je eigen berichten verwijderen.'
      );

      await loadMessages();

      return;

    }


    messages.splice(
      targetIndex,
      1
    );


    await t.set(
      'board',
      'shared',
      'messages',
      messages
    );


    await loadMessages();


  } catch(error) {

    console.error(
      'Verwijderen mislukt:',
      error
    );


    alert(
      'Het bericht kon niet worden verwijderd.'
    );

  }

}


/* =========================
   KNOP + ENTER
========================= */

document
  .getElementById(
    'sendButton'
  )
  .addEventListener(
    'click',
    sendMessage
  );


document
  .getElementById(
    'messageInput'
  )
  .addEventListener(
    'keydown',
    function(event) {

      if (
        event.key === 'Enter'
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================
   CHAT STARTEN
========================= */

async function startChat() {

  /*
    Eerst Trello-gebruiker ophalen.
    Daarna pas de berichten tekenen.

    Daardoor weten we meteen welke
    berichten rechts moeten staan.
  */

  await loadCurrentMember();

  await loadMessages(true);


  /*
    Iedere 5 seconden verversen.
  */

  setInterval(
    function() {

      loadMessages(false);

    },
    5000
  );

}
