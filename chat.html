<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Badfellas Trello Chat</title>

<style>
:root {
  --bg: #020c14;
  --line: #08789b;
  --cyan: #16d5ff;
  --text: #eef7ff;
  --muted: #6f9abd;
  --green: #22df65;
  --danger: #ff6475;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background:
    radial-gradient(
      circle at 80% 20%,
      rgba(8, 93, 132, .18),
      transparent 32%
    ),
    linear-gradient(
      135deg,
      #020911 0%,
      #03121e 55%,
      #020b13 100%
    );
  overflow: hidden;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* =========================
   HEADER
========================= */

.header {
  min-height: 90px;
  padding: 15px 28px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom: 1px solid var(--line);

  background: rgba(2, 13, 22, .94);
}

.brand {
  display: flex;
  align-items: center;
  gap: 16px;
}

.brand-icon {
  width: 52px;
  height: 52px;

  border: 1px solid #116b91;
  border-radius: 50%;

  display: grid;
  place-items: center;

  font-size: 27px;

  background:
    linear-gradient(
      145deg,
      #071a29,
      #03101a
    );
}

.brand-name {
  font-size: 29px;
  letter-spacing: 2px;
  font-weight: 800;
  color: #8fd3ff;
}

.brand-subtitle {
  margin-top: 7px;

  color: #5e9bc6;

  font-size: 9px;
  letter-spacing: 5px;
}

.chat-title {
  text-align: right;
}

.chat-title h1 {
  margin: 0;
  font-size: 24px;
}

.chat-title span {
  display: block;

  margin-top: 7px;

  color: #6596bd;

  letter-spacing: 5px;
  font-size: 9px;
}


/* =========================
   CHAT
========================= */

#chat {
  flex: 1;
  min-height: 0;

  overflow-y: auto;

  padding: 22px 34px 30px;

  scroll-behavior: smooth;
}

#chat::-webkit-scrollbar {
  width: 8px;
}

#chat::-webkit-scrollbar-thumb {
  background: #0c526e;
  border-radius: 20px;
}


/* =========================
   BERICHTREGEL
========================= */

.message-row {
  width: 100%;

  display: flex;
  align-items: flex-start;

  gap: 12px;

  margin-bottom: 18px;
}


/*
  Eigen bericht:
  avatar en bericht naar rechts.
*/

.message-row.own {
  flex-direction: row-reverse;
}


/* =========================
   AVATAR
========================= */

.avatar {
  width: 44px;
  height: 44px;

  min-width: 44px;

  overflow: hidden;

  border-radius: 50%;

  display: grid;
  place-items: center;

  font-size: 13px;
  font-weight: 800;

  color: #bfeaff;

  background:
    linear-gradient(
      145deg,
      #12334b,
      #071724
    );

  border: 1px solid #17465f;
}

.message-row.own .avatar {
  border-color: #16bde9;

  background:
    linear-gradient(
      145deg,
      #0b6687,
      #073047
    );
}

.avatar img {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;
}


/* =========================
   BERICHT INHOUD
========================= */

.message-content {
  max-width: min(700px, 60vw);
}

.message-row.own .message-content {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}


/* naam / tijd / verwijderen */

.meta {
  min-height: 20px;

  display: flex;
  align-items: center;

  gap: 9px;

  margin: 0 7px 5px;
}

.message-row.own .meta {
  flex-direction: row-reverse;
}

.name {
  font-weight: 700;
  font-size: 13px;

  color: #f4f9ff;
}

.time {
  color: var(--muted);
  font-size: 10px;
}


/* =========================
   VERWIJDERKNOP
========================= */

.delete-button {
  width: 24px;
  height: 24px;

  padding: 0;

  border: 0;
  border-radius: 7px;

  cursor: pointer;

  display: grid;
  place-items: center;

  color: #789bb5;

  font-size: 12px;

  background: transparent;

  opacity: .55;

  transition:
    opacity .15s ease,
    color .15s ease,
    background .15s ease;
}

.delete-button:hover {
  opacity: 1;

  color: var(--danger);

  background: rgba(255, 100, 117, .10);
}


/* =========================
   BERICHTBALLON
========================= */

.message {
  min-width: 150px;
  max-width: 100%;

  padding: 10px 15px;

  border-radius:
    7px 18px 18px 18px;

  border: 1px solid #075c7d;

  background:
    linear-gradient(
      145deg,
      #061c2b,
      #03121d
    );

  box-shadow:
    0 8px 20px rgba(0, 0, 0, .16);
}

.message-row.own .message {
  border-color: #0c91bb;

  border-radius:
    18px 7px 18px 18px;

  background:
    linear-gradient(
      145deg,
      #073f56,
      #04273a
    );
}

.message-text {
  font-size: 14px;
  line-height: 1.45;

  white-space: pre-wrap;
  word-break: break-word;
}

.empty {
  text-align: center;

  padding-top: 70px;

  color: #557b98;

  font-size: 14px;
}


/* =========================
   INPUT
========================= */

.composer-wrapper {
  padding: 10px 20px 11px;

  background:
    rgba(2, 12, 20, .98);

  border-top:
    1px solid rgba(8, 120, 155, .35);
}

#input-area {
  display: flex;

  min-height: 48px;

  overflow: hidden;

  border:
    1px solid #087da5;

  border-radius: 14px;

  background: #020d16;
}

.input-icon {
  width: 50px;

  display: grid;
  place-items: center;

  border-right:
    1px solid #075876;

  font-size: 19px;
}

#message {
  flex: 1;

  min-width: 0;

  padding: 0 16px;

  border: 0;
  outline: 0;

  background: transparent;

  color: white;

  font-size: 14px;
}

#message::placeholder {
  color: #577993;
}

#sendButton {
  min-width: 120px;

  border: 0;

  border-left:
    1px solid #19d6ff;

  padding: 0 20px;

  cursor: pointer;

  color: white;

  font-weight: 700;

  background:
    linear-gradient(
      135deg,
      #087ca6,
      #12bde7
    );
}

#sendButton:hover {
  filter: brightness(1.1);
}

#sendButton:disabled {
  opacity: .5;
  cursor: default;
}


/* =========================
   FOOTER
========================= */

.footer {
  padding: 8px 3px 0;

  display: flex;
  justify-content: space-between;
  align-items: center;

  color: #6290b2;

  font-size: 10px;
}

.online {
  display: flex;
  align-items: center;

  gap: 8px;
}

.online-dot {
  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: var(--green);

  box-shadow:
    0 0 8px rgba(34, 223, 101, .5);
}

.footer-brand {
  letter-spacing: 2px;
}


/* =========================
   MOBIEL
========================= */

@media (max-width: 700px) {

  .header {
    min-height: 76px;
    padding: 12px 15px;
  }

  .brand-icon {
    width: 44px;
    height: 44px;

    font-size: 22px;
  }

  .brand-name {
    font-size: 20px;
  }

  .brand-subtitle {
    font-size: 7px;
    letter-spacing: 2px;
  }

  .chat-title h1 {
    font-size: 17px;
  }

  .chat-title span {
    display: none;
  }

  #chat {
    padding:
      16px 12px 22px;
  }

  .message-content {
    max-width:
      calc(100vw - 85px);
  }

  .composer-wrapper {
    padding: 8px;
  }

  .footer-brand {
    display: none;
  }

  #sendButton {
    min-width: 92px;

    padding:
      0 11px;
  }
}

</style>
</head>


<body>

<div class="app">


<header class="header">

  <div class="brand">

    <div class="brand-icon">
      🎩
    </div>

    <div>

      <div class="brand-name">
        BADFELLAS
      </div>

      <div class="brand-subtitle">
        GOOD PEOPLE · GREAT PROJECTS
      </div>

    </div>

  </div>


  <div class="chat-title">

    <h1>
      Trello Chat
    </h1>

    <span>
      SAMEN STERKER
    </span>

  </div>

</header>


<main id="chat">

  <div class="empty">
    Berichten laden...
  </div>

</main>


<div class="composer-wrapper">


  <div id="input-area">

    <div class="input-icon">
      ✎
    </div>


    <input
      id="message"
      type="text"
      maxlength="1000"
      autocomplete="off"
      placeholder="Schrijf een bericht..."
    >


    <button
      id="sendButton"
      type="button"
      onclick="sendMessage()"
    >
      ➤ Verstuur
    </button>

  </div>


  <div class="footer">

    <div class="online">

      <span class="online-dot">
      </span>

      <span>
        Online — berichten worden automatisch opgeslagen
      </span>

    </div>


    <div class="footer-brand">

      BADFELLAS.NL
      &nbsp; | &nbsp;
      GOOD PEOPLE · GREAT PROJECTS

    </div>

  </div>


</div>


</div>


<script src="https://p.trellocdn.com/power-up.min.js"></script>


<script>

/* =========================
   TRELLO
========================= */

const t =
  window.TrelloPowerUp.iframe();


let currentMember = {

  id: null,

  name: 'Teamlid',

  username: '',

  initials: '👤',

  avatar: null

};


/* =========================
   GEBRUIKER LADEN
========================= */

async function loadCurrentMember() {

  try {

    /*
      Dit werkte in onze test:

      getContext().member
      =
      Trello member ID
    */

    const context =
      t.getContext();


    if (
      context &&
      context.member &&
      context.member !== 'notLoggedIn'
    ) {

      currentMember.id =
        String(context.member);

    }


    /*
      Dit werkte óók in onze test:

      t.member()
      =
      naam, username,
      initialen en avatar.
    */

    const member =
      await t.member(
        'id',
        'fullName',
        'username',
        'initials',
        'avatar'
      );


    if (member) {

      currentMember.id =
        String(
          member.id ||
          currentMember.id ||
          ''
        );


      currentMember.name =
        member.fullName ||
        member.username ||
        'Teamlid';


      currentMember.username =
        member.username || '';


      currentMember.initials =
        member.initials ||
        makeInitials(
          currentMember.name
        );


      currentMember.avatar =
        member.avatar || null;

    }


    console.log(
      'Chat gebruiker:',
      currentMember
    );


  } catch(error) {

    console.error(
      'Gebruiker laden mislukt:',
      error
    );

  }

}


/* =========================
   INITIALEN
========================= */

function makeInitials(name) {

  if (!name) {
    return '👤';
  }


  const parts =
    String(name)
      .trim()
      .split(/\s+/)
      .filter(Boolean);


  if (!parts.length) {
    return '👤';
  }


  if (parts.length === 1) {

    return parts[0]
      .substring(0, 2)
      .toUpperCase();

  }


  return (
    parts[0][0] +
    parts[parts.length - 1][0]
  ).toUpperCase();

}


/* =========================
   UNIEK BERICHT-ID
========================= */

function createMessageId() {

  if (
    window.crypto &&
    typeof window.crypto.randomUUID === 'function'
  ) {

    return window.crypto.randomUUID();

  }


  return (
    Date.now().toString(36) +
    '-' +
    Math.random()
      .toString(36)
      .substring(2, 10)
  );

}


/* =========================
   AVATAR MAKEN
========================= */

function createAvatar(message) {

  const avatar =
    document.createElement('div');


  avatar.className =
    'avatar';


  if (message.avatar) {

    const image =
      document.createElement('img');


    image.src =
      message.avatar;


    image.alt =
      message.name ||
      'Trello gebruiker';


    image.onerror =
      function() {

        avatar.innerHTML = '';

        avatar.textContent =
          message.initials ||
          makeInitials(
            message.name
          );

      };


    avatar.appendChild(image);

  } else {

    avatar.textContent =
      message.initials ||
      makeInitials(
        message.name
      );

  }


  return avatar;

}


/* =========================
   BERICHTEN LADEN
========================= */

async function loadMessages(
  forceBottom = false
) {

  try {

    const chat =
      document.getElementById('chat');


    /*
      Onthouden of de gebruiker
      ongeveer onderaan stond.
    */

    const nearBottom =
      chat.scrollHeight -
      chat.scrollTop -
      chat.clientHeight <
      100;


    const messages =
      await t.get(
        'board',
        'shared',
        'messages',
        []
      );


    chat.innerHTML = '';


    if (!messages.length) {

      chat.innerHTML =
        '<div class="empty">' +
        'Nog geen berichten. Start het gesprek!' +
        '</div>';

      return;

    }


    messages.forEach(
      (message, index) => {


        /*
          Bepalen of dit bericht
          van de huidige gebruiker is.
        */

        const isOwn =
          !!currentMember.id &&
          !!message.memberId &&
          String(message.memberId) ===
          String(currentMember.id);


        const row =
          document.createElement(
            'div'
          );


        row.className =
          'message-row' +
          (isOwn ? ' own' : '');


        /*
          Avatar
        */

        const avatar =
          createAvatar(message);


        /*
          Content
        */

        const content =
          document.createElement(
            'div'
          );


        content.className =
          'message-content';


        /*
          Meta
        */

        const meta =
          document.createElement(
            'div'
          );


        meta.className =
          'meta';


        /*
          Naam
        */

        const name =
          document.createElement(
            'span'
          );


        name.className =
          'name';


        name.textContent =
          message.name ||
          'Teamlid';


        /*
          Tijd
        */

        const time =
          document.createElement(
            'span'
          );


        time.className =
          'time';


        time.textContent =
          formatTime(
            message.time
          );


        /*
          Meta opbouwen
        */

        meta.appendChild(name);

        meta.appendChild(time);


        /*
          Alleen bij eigen berichten
          verschijnt verwijderen.
        */

        if (isOwn) {

          const deleteButton =
            document.createElement(
              'button'
            );


          deleteButton.type =
            'button';


          deleteButton.className =
            'delete-button';


          deleteButton.title =
            'Bericht verwijderen';


          deleteButton.setAttribute(
            'aria-label',
            'Bericht verwijderen'
          );


          deleteButton.textContent =
            '🗑';


          deleteButton.onclick =
            function() {

              deleteMessage(
                message.id,
                index
              );

            };


          meta.appendChild(
            deleteButton
          );

        }


        /*
          Berichtballon
        */

        const bubble =
          document.createElement(
            'div'
          );


        bubble.className =
          'message';


        const text =
          document.createElement(
            'div'
          );


        text.className =
          'message-text';


        text.textContent =
          message.text || '';


        bubble.appendChild(
          text
        );


        /*
          Alles samenvoegen
        */

        content.appendChild(
          meta
        );


        content.appendChild(
          bubble
        );


        row.appendChild(
          avatar
        );


        row.appendChild(
          content
        );


        chat.appendChild(
          row
        );

      }
    );


    if (
      forceBottom ||
      nearBottom
    ) {

      chat.scrollTop =
        chat.scrollHeight;

    }


  } catch(error) {

    console.error(
      'Berichten laden mislukt:',
      error
    );

  }

}


/* =========================
   BERICHT VERSTUREN
========================= */

async function sendMessage() {

  const input =
    document.getElementById(
      'message'
    );


  const button =
    document.getElementById(
      'sendButton'
    );


  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  try {

    button.disabled = true;


    /*
      Voor iedere verzending nog
      één keer de Trello-gebruiker
      controleren.
    */

    await loadCurrentMember();


    if (!currentMember.id) {

      throw new Error(
        'Geen Trello-gebruiker gevonden.'
      );

    }


    const context =
      t.getContext();


    if (
      context.permissions &&
      context.permissions.board !==
      'write'
    ) {

      alert(
        'Je hebt geen toestemming om berichten te plaatsen.'
      );

      return;

    }


    let messages =
      await t.get(
        'board',
        'shared',
        'messages',
        []
      );


    /*
      Nieuw bericht.
    */

    messages.push({

      id:
        createMessageId(),

      memberId:
        currentMember.id,

      name:
        currentMember.name,

      username:
        currentMember.username,

      initials:
        currentMember.initials,

      avatar:
        currentMember.avatar,

      text:
        text,

      time:
        new Date()
          .toISOString()

    });


    await t.set(
      'board',
      'shared',
      'messages',
      messages
    );


    input.value = '';


    await loadMessages(true);


    input.focus();


  } catch(error) {

    console.error(
      'Bericht versturen mislukt:',
      error
    );


    alert(
      'Het bericht kon niet worden verstuurd.'
    );


  } finally {

    button.disabled = false;

  }

}


/* =========================
   BERICHT VERWIJDEREN
========================= */

async function deleteMessage(
  messageId,
  fallbackIndex
) {

  try {

    /*
      Eerst bevestiging.
    */

    const confirmed =
      window.confirm(
        'Weet je zeker dat je dit bericht wilt verwijderen?'
      );


    if (!confirmed) {
      return;
    }


    /*
      Gebruiker opnieuw controleren.
    */

    await loadCurrentMember();


    let messages =
      await t.get(
        'board',
        'shared',
        'messages',
        []
      );


    /*
      Zoek het bericht.

      Nieuwe berichten hebben
      een uniek ID.

      fallbackIndex is alleen voor
      compatibiliteit.
    */

    const target =
      messages.find(
        (message, index) => {

          if (
            messageId &&
            message.id
          ) {

            return (
              message.id ===
              messageId
            );

          }


          return (
            index ===
            fallbackIndex
          );

        }
      );


    if (!target) {

      alert(
        'Dit bericht bestaat niet meer.'
      );

      await loadMessages();

      return;

    }


    /*
      Beveiliging:
      alleen eigenaar mag verwijderen.
    */

    if (
      !target.memberId ||
      String(target.memberId) !==
      String(currentMember.id)
    ) {

      alert(
        'Je kunt alleen je eigen berichten verwijderen.'
      );

      await loadMessages();

      return;

    }


    /*
      Bericht verwijderen.
    */

    if (
      messageId &&
      target.id
    ) {

      messages =
        messages.filter(
          message =>
            message.id !==
            messageId
        );

    } else {

      messages =
        messages.filter(
          (message, index) =>
            index !==
            fallbackIndex
        );

    }


    await t.set(
      'board',
      'shared',
      'messages',
      messages
    );


    await loadMessages();


  } catch(error) {

    console.error(
      'Bericht verwijderen mislukt:',
      error
    );


    alert(
      'Het bericht kon niet worden verwijderd.'
    );

  }

}


/* =========================
   DATUM / TIJD
========================= */

function formatTime(value) {

  if (!value) {
    return '';
  }


  const date =
    new Date(value);


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return value;

  }


  return date.toLocaleString(
    'nl-NL',
    {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    }
  );

}


/* =========================
   ENTER = VERSTUREN
========================= */

document
  .getElementById(
    'message'
  )
  .addEventListener(
    'keydown',
    function(event) {

      if (
        event.key ===
        'Enter'
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================
   START
========================= */

async function startChat() {

  /*
    Eerst gebruiker.
    Daarna berichten.

    Dit is belangrijk voor
    links/rechts herkenning.
  */

  await loadCurrentMember();

  await loadMessages(true);


  /*
    Iedere 5 seconden
    nieuwe berichten ophalen.
  */

  setInterval(
    function() {

      loadMessages(false);

    },
    5000
  );

}


startChat();

</script>

</body>
</html>
