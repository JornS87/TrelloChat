<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Badfellas Trello Chat</title>

<style>
  :root {
    --bg: #020c14;
    --panel: #061522;
    --panel2: #081c2b;
    --line: #08789b;
    --cyan: #16d5ff;
    --blue: #159bd1;
    --text: #eef7ff;
    --muted: #6f9abd;
    --green: #22df65;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    background:
      radial-gradient(
        circle at 80% 20%,
        rgba(8, 93, 132, .18),
        transparent 32%
      ),
      linear-gradient(
        135deg,
        #020911 0%,
        #03121e 55%,
        #020b13 100%
      );
    overflow: hidden;
  }

  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* HEADER */

  .header {
    min-height: 90px;
    padding: 15px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
    border-bottom: 1px solid var(--line);
    background: rgba(2, 13, 22, .94);
    box-shadow: 0 8px 30px rgba(0, 0, 0, .25);
    z-index: 2;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand-icon {
    width: 52px;
    height: 52px;
    border: 1px solid #116b91;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #74caff;
    font-size: 27px;
    background: linear-gradient(145deg, #071a29, #03101a);
    box-shadow: 0 0 25px rgba(0, 173, 238, .08);
  }

  .brand-name {
    margin: 0;
    font-size: 29px;
    line-height: 1;
    letter-spacing: 2px;
    font-weight: 800;
    color: #8fd3ff;
  }

  .brand-subtitle {
    margin-top: 7px;
    color: #5e9bc6;
    font-size: 9px;
    letter-spacing: 5px;
  }

  .chat-title {
    text-align: right;
  }

  .chat-title h1 {
    margin: 0;
    font-size: 24px;
    letter-spacing: .5px;
  }

  .chat-title span {
    display: block;
    margin-top: 7px;
    color: #6596bd;
    letter-spacing: 5px;
    font-size: 9px;
  }

  /* CHAT */

  #chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 22px 34px 30px;
    scroll-behavior: smooth;
    z-index: 1;
  }

  #chat::-webkit-scrollbar {
    width: 8px;
  }

  #chat::-webkit-scrollbar-thumb {
    background: #0c526e;
    border-radius: 20px;
  }

  /*
    Iedere berichtregel gebruikt de volledige breedte.
    Daardoor kunnen eigen berichten echt rechts staan.
  */

  .message-row {
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    gap: 12px;
    margin-bottom: 18px;
  }

  /*
    Eigen berichten worden omgedraaid:
    avatar rechts, tekstballon daarvoor.
  */

  .message-row.own {
    justify-content: flex-start;
    flex-direction: row-reverse;
  }

  .message-content {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    max-width: min(700px, 62vw);
  }

  .message-row.own .message-content {
    align-items: flex-end;
  }

  .avatar {
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: 50%;
    overflow: hidden;
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 800;
    color: #bfeaff;
    background: linear-gradient(145deg, #12334b, #071724);
    border: 1px solid #17465f;
    box-shadow: 0 5px 16px rgba(0, 0, 0, .3);
  }

  .message-row.own .avatar {
    border-color: #159bc7;
    background: linear-gradient(145deg, #0c5671, #073047);
  }

  .avatar img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .message-meta {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0 7px 5px;
  }

  .message-row.own .message-meta {
    flex-direction: row-reverse;
  }

  .name {
    font-weight: 700;
    color: #f4f9ff;
    font-size: 13px;
  }

  .time {
    color: var(--muted);
    font-size: 10px;
  }

  .message {
    min-width: 150px;
    max-width: 100%;
    padding: 10px 15px 11px;
    border-radius: 7px 18px 18px 18px;
    border: 1px solid #075c7d;
    background:
      linear-gradient(
        145deg,
        rgba(6, 28, 43, .96),
        rgba(3, 18, 29, .96)
      );
    box-shadow: 0 8px 20px rgba(0, 0, 0, .16);
  }

  .message-row.own .message {
    border-color: #0c91bb;
    border-radius: 18px 7px 18px 18px;
    background:
      linear-gradient(
        145deg,
        rgba(7, 63, 86, .97),
        rgba(4, 39, 58, .97)
      );
  }

  .message-text {
    color: #edf6fd;
    font-size: 14px;
    line-height: 1.45;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .empty {
    color: #557b98;
    text-align: center;
    padding-top: 70px;
    font-size: 14px;
  }

  /* ONDERKANT */

  .composer-wrapper {
    padding: 10px 20px 11px;
    background: rgba(2, 12, 20, .98);
    border-top: 1px solid rgba(8, 120, 155, .35);
    z-index: 3;
  }

  #input-area {
    display: flex;
    align-items: stretch;
    min-height: 48px;
    border: 1px solid #087da5;
    border-radius: 14px;
    overflow: hidden;
    background: #020d16;
    box-shadow:
      0 0 0 1px rgba(0, 194, 255, .03),
      0 8px 24px rgba(0, 0, 0, .25);
  }

  .input-icon {
    width: 50px;
    display: grid;
    place-items: center;
    color: #b7dcf5;
    font-size: 19px;
    border-right: 1px solid #075876;
  }

  #message {
    flex: 1;
    min-width: 0;
    padding: 0 16px;
    border: 0;
    outline: 0;
    background: transparent;
    color: white;
    font-size: 14px;
  }

  #message::placeholder {
    color: #577993;
  }

  #message:focus {
    background: rgba(9, 64, 88, .12);
  }

  #sendButton {
    min-width: 120px;
    border: 0;
    border-left: 1px solid #19d6ff;
    padding: 0 20px;
    cursor: pointer;
    color: white;
    font-size: 14px;
    font-weight: 700;
    background: linear-gradient(135deg, #087ca6, #12bde7);
    transition: .15s ease;
  }

  #sendButton:hover {
    filter: brightness(1.13);
  }

  #sendButton:active {
    transform: scale(.98);
  }

  #sendButton:disabled {
    opacity: .55;
    cursor: default;
  }

  .footer {
    padding: 8px 3px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    color: #6290b2;
    font-size: 10px;
  }

  .online {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .online-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 9px rgba(34, 223, 101, .55);
  }

  .footer-brand {
    letter-spacing: 2px;
    text-align: right;
  }

  @media (max-width: 700px) {

    .header {
      min-height: 76px;
      padding: 12px 15px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      font-size: 22px;
    }

    .brand-name {
      font-size: 20px;
    }

    .brand-subtitle {
      letter-spacing: 2px;
      font-size: 7px;
    }

    .chat-title h1 {
      font-size: 17px;
    }

    .chat-title span {
      display: none;
    }

    #chat {
      padding: 16px 12px 22px;
    }

    .message-content {
      max-width: calc(100vw - 85px);
    }

    .composer-wrapper {
      padding: 8px;
    }

    .footer-brand {
      display: none;
    }

    #sendButton {
      min-width: 92px;
      padding: 0 11px;
    }
  }
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="brand">

      <div class="brand-icon">🎩</div>

      <div>
        <div class="brand-name">BADFELLAS</div>
        <div class="brand-subtitle">
          GOOD PEOPLE · GREAT PROJECTS
        </div>
      </div>

    </div>

    <div class="chat-title">
      <h1>Trello Chat</h1>
      <span>SAMEN STERKER</span>
    </div>

  </header>


  <main id="chat">
    <div class="empty">Berichten laden...</div>
  </main>


  <div class="composer-wrapper">

    <div id="input-area">

      <div class="input-icon">✎</div>

      <input
        id="message"
        type="text"
        autocomplete="off"
        maxlength="1000"
        placeholder="Schrijf een bericht..."
      >

      <button
        id="sendButton"
        type="button"
        onclick="sendMessage()"
      >
        ➤ Verstuur
      </button>

    </div>


    <div class="footer">

      <div class="online">
        <span class="online-dot"></span>
        <span>
          Online — berichten worden automatisch opgeslagen
        </span>
      </div>

      <div class="footer-brand">
        BADFELLAS.NL &nbsp; | &nbsp;
        GOOD PEOPLE · GREAT PROJECTS
      </div>

    </div>

  </div>

</div>


<script src="https://p.trellocdn.com/power-up.min.js"></script>

<script>

const t = window.TrelloPowerUp.iframe();


let currentMember = {
  id: null,
  name: 'Teamlid',
  username: '',
  avatar: null,
  initials: ''
};


/* ---------------------------
   HUIDIGE TRELLO-GEBRUIKER
---------------------------- */

async function loadCurrentMember() {

  try {

    const member = await t.member(
      'id',
      'fullName',
      'username',
      'avatar',
      'initials'
    );

    currentMember = {
      id: member.id || null,
      name:
        member.fullName ||
        member.username ||
        'Teamlid',
      username:
        member.username || '',
      avatar:
        member.avatar || null,
      initials:
        member.initials ||
        makeInitials(
          member.fullName ||
          member.username ||
          'Teamlid'
        )
    };

    console.log(
      'Trello-gebruiker:',
      currentMember
    );

  } catch (error) {

    console.error(
      'Trello-gebruiker kon niet worden geladen:',
      error
    );

  }

}


/* ---------------------------
   INITIALEN
---------------------------- */

function makeInitials(name) {

  if (!name) {
    return '👤';
  }

  const parts =
    name
      .trim()
      .split(/\s+/)
      .filter(Boolean);

  if (!parts.length) {
    return '👤';
  }

  if (parts.length === 1) {
    return parts[0]
      .substring(0, 2)
      .toUpperCase();
  }

  return (
    parts[0][0] +
    parts[parts.length - 1][0]
  ).toUpperCase();

}


/* ---------------------------
   AVATAR MAKEN
---------------------------- */

function createAvatar(message) {

  const avatar =
    document.createElement('div');

  avatar.className = 'avatar';

  /*
    Nieuwe berichten bewaren avatar-informatie.
    Oude berichten hebben dit nog niet.
  */

  if (message.avatar) {

    const image =
      document.createElement('img');

    image.src = message.avatar;
    image.alt = message.name || 'Trello gebruiker';

    image.onerror = function() {
      avatar.innerHTML = '';
      avatar.textContent =
        message.initials ||
        makeInitials(message.name);
    };

    avatar.appendChild(image);

  } else {

    avatar.textContent =
      message.initials ||
      makeInitials(message.name);

  }

  return avatar;

}


/* ---------------------------
   BERICHTEN LADEN
---------------------------- */

async function loadMessages() {

  try {

    const messages =
      await t.get(
        'board',
        'shared',
        'messages',
        []
      );

    const chat =
      document.getElementById('chat');

    /*
      Alleen automatisch helemaal naar beneden
      als de gebruiker al ongeveer onderaan stond.
    */

    const wasNearBottom =
      chat.scrollHeight -
      chat.scrollTop -
      chat.clientHeight < 100;

    chat.innerHTML = '';

    if (!messages.length) {

      chat.innerHTML =
        '<div class="empty">' +
        'Nog geen berichten. Start het gesprek!' +
        '</div>';

      return;
    }


    messages.forEach(message => {

      const isOwn =
        !!currentMember.id &&
        !!message.memberId &&
        message.memberId === currentMember.id;


      const row =
        document.createElement('div');

      row.className =
        'message-row' +
        (isOwn ? ' own' : '');


      const avatar =
        createAvatar(message);


      const content =
        document.createElement('div');

      content.className =
        'message-content';


      const meta =
        document.createElement('div');

      meta.className =
        'message-meta';


      const name =
        document.createElement('span');

      name.className = 'name';

      name.textContent =
        message.name || 'Teamlid';


      const time =
        document.createElement('span');

      time.className = 'time';

      time.textContent =
        formatTime(message.time);


      const bubble =
        document.createElement('div');

      bubble.className = 'message';


      const text =
        document.createElement('div');

      text.className =
        'message-text';

      text.textContent =
        message.text || '';


      meta.appendChild(name);
      meta.appendChild(time);

      bubble.appendChild(text);

      content.appendChild(meta);
      content.appendChild(bubble);

      row.appendChild(avatar);
      row.appendChild(content);

      chat.appendChild(row);

    });


    if (wasNearBottom) {
      chat.scrollTop =
        chat.scrollHeight;
    }

  } catch (error) {

    console.error(
      'Berichten konden niet worden geladen:',
      error
    );

  }

}


/* ---------------------------
   BERICHT VERSTUREN
---------------------------- */

async function sendMessage() {

  const input =
    document.getElementById('message');

  const button =
    document.getElementById('sendButton');

  const text =
    input.value.trim();

  if (!text) {
    return;
  }


  try {

    const context =
      t.getContext();

    if (
      context.permissions &&
      context.permissions.board !== 'write'
    ) {

      alert(
        'Je hebt geen toestemming om berichten te plaatsen.'
      );

      return;
    }


    button.disabled = true;


    /*
      Voor de zekerheid nogmaals gebruiker laden
      wanneer die bij het openen niet beschikbaar was.
    */

    if (!currentMember.id) {
      await loadCurrentMember();
    }


    let messages =
      await t.get(
        'board',
        'shared',
        'messages',
        []
      );


    messages.push({

      name:
        currentMember.name,

      memberId:
        currentMember.id,

      username:
        currentMember.username,

      avatar:
        currentMember.avatar,

      initials:
        currentMember.initials,

      text:
        text,

      time:
        new Date().toISOString()

    });


    await t.set(
      'board',
      'shared',
      'messages',
      messages
    );


    input.value = '';

    await loadMessages();

    /*
      Na versturen altijd naar het nieuwste bericht.
    */

    const chat =
      document.getElementById('chat');

    chat.scrollTop =
      chat.scrollHeight;

    input.focus();

  } catch (error) {

    console.error(
      'Bericht kon niet worden verstuurd:',
      error
    );

    alert(
      'Het bericht kon niet worden verstuurd.'
    );

  } finally {

    button.disabled = false;

  }

}


/* ---------------------------
   DATUM / TIJD
---------------------------- */

function formatTime(value) {

  if (!value) {
    return '';
  }

  const date =
    new Date(value);

  /*
    Oude berichten kunnen nog in een ander
    datumformaat opgeslagen zijn.
  */

  if (isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleString(
    'nl-NL',
    {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    }
  );

}


/* ---------------------------
   ENTER = VERSTUREN
---------------------------- */

document
  .getElementById('message')
  .addEventListener(
    'keydown',
    function(event) {

      if (
        event.key === 'Enter' &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* ---------------------------
   START
---------------------------- */

async function startChat() {

  await loadCurrentMember();

  await loadMessages();

  /*
    Iedere 5 seconden controleren of
    collega's nieuwe berichten hebben geplaatst.
  */

  setInterval(
    loadMessages,
    5000
  );

}


startChat();

</script>

</body>
</html>
