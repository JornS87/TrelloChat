<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badfellas Trello Chat</title>

<style>
:root {
  --bg: #020c14;
  --line: #08789b;
  --cyan: #16d5ff;
  --text: #eef7ff;
  --muted: #6f9abd;
  --green: #22df65;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 80% 20%, rgba(8,93,132,.18), transparent 32%),
    linear-gradient(135deg,#020911 0%,#03121e 55%,#020b13 100%);
  overflow: hidden;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  min-height: 90px;
  padding: 15px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  background: rgba(2,13,22,.94);
}

.brand {
  display: flex;
  align-items: center;
  gap: 16px;
}

.brand-icon {
  width: 52px;
  height: 52px;
  border: 1px solid #116b91;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 27px;
  background: linear-gradient(145deg,#071a29,#03101a);
}

.brand-name {
  font-size: 29px;
  letter-spacing: 2px;
  font-weight: 800;
  color: #8fd3ff;
}

.brand-subtitle {
  margin-top: 7px;
  color: #5e9bc6;
  font-size: 9px;
  letter-spacing: 5px;
}

.chat-title {
  text-align: right;
}

.chat-title h1 {
  margin: 0;
  font-size: 24px;
}

.chat-title span {
  display: block;
  margin-top: 7px;
  color: #6596bd;
  letter-spacing: 5px;
  font-size: 9px;
}

/* CHAT */

#chat {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 22px 34px 30px;
}

.message-row {
  width: 100%;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 18px;
}

/* EIGEN BERICHT RECHTS */

.message-row.own {
  flex-direction: row-reverse;
}

.message-content {
  max-width: min(700px, 60vw);
}

.message-row.own .message-content {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

.avatar {
  width: 44px;
  height: 44px;
  min-width: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 14px;
  font-weight: 800;
  color: #bfeaff;
  background: linear-gradient(145deg,#12334b,#071724);
  border: 1px solid #17465f;
}

.message-row.own .avatar {
  border-color: #16bde9;
  background: linear-gradient(145deg,#0b6687,#073047);
}

.meta {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 0 7px 5px;
}

.message-row.own .meta {
  flex-direction: row-reverse;
}

.name {
  font-weight: 700;
  font-size: 13px;
}

.time {
  color: var(--muted);
  font-size: 10px;
}

.message {
  min-width: 150px;
  max-width: 100%;
  padding: 10px 15px;
  border-radius: 7px 18px 18px 18px;
  border: 1px solid #075c7d;
  background: linear-gradient(145deg,#061c2b,#03121d);
}

.message-row.own .message {
  border-color: #0c91bb;
  border-radius: 18px 7px 18px 18px;
  background: linear-gradient(145deg,#073f56,#04273a);
}

.message-text {
  font-size: 14px;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
}

.empty {
  text-align: center;
  padding-top: 70px;
  color: #557b98;
}

/* INPUT */

.composer-wrapper {
  padding: 10px 20px 11px;
  background: rgba(2,12,20,.98);
  border-top: 1px solid rgba(8,120,155,.35);
}

#input-area {
  display: flex;
  min-height: 48px;
  border: 1px solid #087da5;
  border-radius: 14px;
  overflow: hidden;
  background: #020d16;
}

.input-icon {
  width: 50px;
  display: grid;
  place-items: center;
  border-right: 1px solid #075876;
  font-size: 19px;
}

#message {
  flex: 1;
  min-width: 0;
  padding: 0 16px;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  font-size: 14px;
}

#message::placeholder {
  color: #577993;
}

#sendButton {
  min-width: 120px;
  border: 0;
  border-left: 1px solid #19d6ff;
  padding: 0 20px;
  cursor: pointer;
  color: white;
  font-weight: 700;
  background: linear-gradient(135deg,#087ca6,#12bde7);
}

#sendButton:disabled {
  opacity: .5;
}

.footer {
  padding: 8px 3px 0;
  display: flex;
  justify-content: space-between;
  color: #6290b2;
  font-size: 10px;
}

.online {
  display: flex;
  align-items: center;
  gap: 8px;
}

.online-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
}

.footer-brand {
  letter-spacing: 2px;
}

@media(max-width:700px) {
  #chat { padding: 16px 12px; }
  .message-content { max-width: calc(100vw - 85px); }
  .footer-brand { display:none; }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="brand">
    <div class="brand-icon">🎩</div>

    <div>
      <div class="brand-name">BADFELLAS</div>
      <div class="brand-subtitle">
        GOOD PEOPLE · GREAT PROJECTS
      </div>
    </div>
  </div>

  <div class="chat-title">
    <h1>Trello Chat</h1>
    <span>SAMEN STERKER</span>
  </div>

</header>


<main id="chat">
  <div class="empty">Berichten laden...</div>
</main>


<div class="composer-wrapper">

  <div id="input-area">

    <div class="input-icon">✎</div>

    <input
      id="message"
      type="text"
      maxlength="1000"
      autocomplete="off"
      placeholder="Schrijf een bericht..."
    >

    <button
      id="sendButton"
      onclick="sendMessage()"
    >
      ➤ Verstuur
    </button>

  </div>

  <div class="footer">

    <div class="online">
      <span class="online-dot"></span>
      <span>
        Online — berichten worden automatisch opgeslagen
      </span>
    </div>

    <div class="footer-brand">
      BADFELLAS.NL | GOOD PEOPLE · GREAT PROJECTS
    </div>

  </div>

</div>

</div>


<script src="https://p.trellocdn.com/power-up.min.js"></script>

<script>

const t = window.TrelloPowerUp.iframe();

let currentMember = {
  id: null,
  name: 'Teamlid',
  initials: '👤'
};


/* ===========================
   GEBRUIKER LADEN
=========================== */

async function loadCurrentMember() {

  try {

    /*
      BELANGRIJK:
      context.member IS de Trello member-ID.
    */

    const context = t.getContext();

    if (
      context &&
      context.member &&
      context.member !== 'notLoggedIn'
    ) {
      currentMember.id = context.member;
    }


    /*
      Naam + initialen apart bij Trello ophalen.
    */

    const member = await t.member(
      'id',
      'fullName',
      'username',
      'initials'
    );

    if (member) {

      currentMember.id =
        member.id ||
        currentMember.id;

      currentMember.name =
        member.fullName ||
        member.username ||
        'Teamlid';

      currentMember.initials =
        member.initials ||
        makeInitials(currentMember.name);
    }


    console.log(
      'Huidige Trello gebruiker:',
      currentMember
    );

  } catch(error) {

    console.error(
      'Gebruiker laden mislukt:',
      error
    );

    /*
      Zelfs als t.member() mislukt,
      behouden we de ID uit getContext().
    */

    try {

      const context = t.getContext();

      if (
        context.member &&
        context.member !== 'notLoggedIn'
      ) {
        currentMember.id = context.member;
      }

    } catch(e) {}

  }

}


/* ===========================
   INITIALEN
=========================== */

function makeInitials(name) {

  if (!name) return '👤';

  const parts =
    name.trim().split(/\s+/);

  if (parts.length === 1) {
    return parts[0]
      .substring(0,2)
      .toUpperCase();
  }

  return (
    parts[0][0] +
    parts[parts.length - 1][0]
  ).toUpperCase();
}


/* ===========================
   BERICHTEN LADEN
=========================== */

async function loadMessages() {

  try {

    const messages =
      await t.get(
        'board',
        'shared',
        'messages',
        []
      );

    const chat =
      document.getElementById('chat');

    chat.innerHTML = '';

    if (!messages.length) {

      chat.innerHTML =
        '<div class="empty">' +
        'Nog geen berichten. Start het gesprek!' +
        '</div>';

      return;
    }


    messages.forEach(message => {

      /*
        Dit bepaalt links/rechts.
      */

      const isOwn =
        currentMember.id &&
        message.memberId &&
        String(message.memberId) ===
        String(currentMember.id);


      const row =
        document.createElement('div');

      row.className =
        'message-row' +
        (isOwn ? ' own' : '');


      const avatar =
        document.createElement('div');

      avatar.className = 'avatar';

      avatar.textContent =
        message.initials ||
        makeInitials(message.name);


      const content =
        document.createElement('div');

      content.className =
        'message-content';


      const meta =
        document.createElement('div');

      meta.className = 'meta';


      const name =
        document.createElement('span');

      name.className = 'name';

      name.textContent =
        message.name || 'Teamlid';


      const time =
        document.createElement('span');

      time.className = 'time';

      time.textContent =
        formatTime(message.time);


      const bubble =
        document.createElement('div');

      bubble.className = 'message';


      const text =
        document.createElement('div');

      text.className = 'message-text';

      text.textContent =
        message.text || '';


      meta.appendChild(name);
      meta.appendChild(time);

      bubble.appendChild(text);

      content.appendChild(meta);
      content.appendChild(bubble);

      row.appendChild(avatar);
      row.appendChild(content);

      chat.appendChild(row);

    });


    chat.scrollTop =
      chat.scrollHeight;

  } catch(error) {

    console.error(
      'Berichten laden mislukt:',
      error
    );

  }

}


/* ===========================
   VERSTUREN
=========================== */

async function sendMessage() {

  const input =
    document.getElementById('message');

  const button =
    document.getElementById('sendButton');

  const text =
    input.value.trim();

  if (!text) return;


  try {

    /*
      Nog één keer gebruiker controleren
      vóór het bericht wordt opgeslagen.
    */

    await loadCurrentMember();


    const context =
      t.getContext();

    if (
      context.permissions &&
      context.permissions.board !== 'write'
    ) {

      alert(
        'Je hebt geen toestemming om berichten te plaatsen.'
      );

      return;
    }


    button.disabled = true;


    let messages =
      await t.get(
        'board',
        'shared',
        'messages',
        []
      );


    messages.push({

      name:
        currentMember.name,

      memberId:
        currentMember.id,

      initials:
        currentMember.initials,

      text:
        text,

      time:
        new Date().toISOString()

    });


    await t.set(
      'board',
      'shared',
      'messages',
      messages
    );


    input.value = '';

    await loadMessages();

    input.focus();

  } catch(error) {

    console.error(
      'Versturen mislukt:',
      error
    );

    alert(
      'Het bericht kon niet worden verstuurd.'
    );

  } finally {

    button.disabled = false;

  }

}


/* ===========================
   DATUM
=========================== */

function formatTime(value) {

  if (!value) return '';

  const date =
    new Date(value);

  if (isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleString(
    'nl-NL',
    {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    }
  );
}


/* ===========================
   ENTER
=========================== */

document
  .getElementById('message')
  .addEventListener(
    'keydown',
    function(event) {

      if (event.key === 'Enter') {

        event.preventDefault();

        sendMessage();
      }

    }
  );


/* ===========================
   START
=========================== */

async function startChat() {

  await loadCurrentMember();

  await loadMessages();

  setInterval(
    loadMessages,
    5000
  );
}

startChat();

</script>

</body>
</html>
