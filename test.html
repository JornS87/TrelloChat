<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Trello gebruiker test</title>
</head>

<body style="
  background:#020c14;
  color:white;
  font-family:Arial;
  padding:30px;
">

<h1>Trello gebruiker test</h1>

<pre id="result">
Even wachten...
</pre>

<script src="https://p.trellocdn.com/power-up.min.js"></script>

<script>

const t = window.TrelloPowerUp.iframe();

async function test() {

  const result =
    document.getElementById('result');

  try {

    const context =
      t.getContext();

    let member = null;
    let memberError = null;

    try {

      member = await t.member(
        'id',
        'fullName',
        'username',
        'initials',
        'avatar'
      );

    } catch(error) {

      memberError =
        error.message || String(error);

    }

    result.textContent =
      'GETCONTEXT:\n\n' +
      JSON.stringify(context, null, 2) +
      '\n\n\nT.MEMBER:\n\n' +
      JSON.stringify(member, null, 2) +
      '\n\n\nT.MEMBER ERROR:\n\n' +
      JSON.stringify(memberError, null, 2);

  } catch(error) {

    result.textContent =
      'ALGEMENE FOUT:\n\n' +
      (error.stack || error.message || String(error));

  }

}

test();

</script>

</body>
</html>
